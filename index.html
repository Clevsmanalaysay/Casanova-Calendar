<!DOCTYPE html>
<html lang="en" class="h-full bg-dark-900" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casanova Garden Resort & Events Place - Booking Calendar</title>
    <!-- Favicons -->
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <!-- PWA: "Add to Home Screen" / installed-app icon -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#D4AF37">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Casanova Calendar">
    <!-- Apply saved theme before first paint to avoid a flash of the wrong theme -->
    <script>
        (function () {
            try {
                var saved = localStorage.getItem('casanova_theme');
                if (saved === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
            } catch (e) { /* localStorage unavailable (private mode, etc.) — light stays default */ }
        })();
    </script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Great Vibes (for script logo), Playfair Display (Serif), Plus Jakarta Sans (Body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital,wght@0,400..800;1,400..800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                        script: ['Great Vibes', 'cursive']
                    },
                    colors: {
                        // gold/dark/slate below resolve through CSS variables (defined in <style>)
                        // so every existing text-/bg-/border- class automatically re-themes —
                        // no per-element class changes needed. text-black stays literal on purpose:
                        // it's used for button labels on bright gold surfaces, which must stay dark
                        // in both themes.
                        gold: {
                            100: '#FBF5E5',
                            200: '#F4E6BD',
                            300: 'var(--gold-300)',
                            400: 'var(--gold-400)',
                            500: '#D4AF37', // Primary Metallic Gold — constant brand accent in both themes
                            600: '#C9A227',
                            700: '#A37F1C',
                            800: '#7B5E12',
                            900: '#4D3A0A',
                        },
                        dark: {
                            900: 'var(--dark-900)', // Page background
                            800: 'var(--dark-800)', // Header & Panels
                            700: 'var(--dark-700)', // Recessed/nested surfaces
                            600: 'var(--dark-600)', // Borders & Hover
                            500: 'var(--dark-500)'
                        },
                        slate: {
                            100: 'var(--ink-100)',
                            200: 'var(--ink-200)',
                            300: 'var(--ink-300)',
                            400: 'var(--ink-400)',
                            500: 'var(--ink-500)',
                            600: 'var(--ink-600)'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* LIGHT THEME (default) */
        :root {
            --dark-900: #F7F5F0;
            --dark-800: #FFFFFF;
            --dark-700: #F3F1EA;
            --dark-600: #E4DFD1;
            --dark-500: #D3CBB8;

            --ink-100: #111827;
            --ink-200: #1F2937;
            --ink-300: #374151;
            --ink-400: #6B7280;
            --ink-500: #9CA3AF;
            --ink-600: #D1D5DB;

            --gold-300: #8A6A18;
            --gold-400: #8A6418;

            --gold-grad-text: linear-gradient(135deg, #C9A227 0%, #A37F1C 50%, #4D3A0A 100%);
            --gold-border-color: rgba(154, 119, 28, 0.35);
        }

        /* DARK THEME */
        :root[data-theme="dark"] {
            --dark-900: #0D0D0D;
            --dark-800: #141414;
            --dark-700: #1E1E1E;
            --dark-600: #2A2A2A;
            --dark-500: #383838;

            --ink-100: #F8FAFC;
            --ink-200: #E2E8F0;
            --ink-300: #CBD5E1;
            --ink-400: #94A3B8;
            --ink-500: #64748B;
            --ink-600: #475569;

            --gold-300: #E8D08D;
            --gold-400: #DCA352;

            --gold-grad-text: linear-gradient(135deg, #FFF0CA 0%, #D4AF37 50%, #9A771C 100%);
            --gold-border-color: rgba(212, 175, 55, 0.25);
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--dark-800); }
        ::-webkit-scrollbar-thumb { background: var(--dark-500); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #D4AF37; }

        .gold-gradient-text {
            background: var(--gold-grad-text);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .gold-gradient-bg {
            background: linear-gradient(135deg, #E5C158 0%, #C9A227 50%, #A37F1C 100%);
        }

        .gold-gradient-bg:hover {
            background: linear-gradient(135deg, #F0CE68 0%, #D4AF37 50%, #B58E22 100%);
        }

        .gold-border {
            border-color: var(--gold-border-color);
        }

        .gold-border-glow {
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.08);
        }
    </style>
</head>
<body class="h-full font-sans text-slate-200 antialiased flex flex-col bg-dark-900 selection:bg-gold-500 selection:text-black">

    <!-- BRAND HEADER -->
    <header class="bg-dark-800 border-b gold-border sticky top-0 z-20 shadow-xl">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 h-20 flex items-center justify-between">
            
            <!-- CASANOVA BRANDING LOGO -->
            <div class="flex items-center space-x-3 py-2">

    <!-- MAIN APP CONTENT -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 py-6 space-y-6">

        <!-- PASTE BOOKING SECTION -->
        <div class="bg-dark-800 p-5 sm:p-6 rounded-2xl border gold-border gold-border-glow space-y-4">
            <div class="flex flex-wrap items-center justify-between gap-2">
                <label for="rawTextInput" class="text-sm font-semibold text-slate-100 flex items-center space-x-2">
                    <i class="fa-solid fa-paste text-gold-500"></i>
                    <span class="font-serif text-base sm:text-lg tracking-wide gold-gradient-text">Paste Booking Details</span>

                <span class="text-xs text-slate-400 font-normal">

            <div class="relative">

            <div class="flex items-center space-x-3">
                <button onclick="changeMonth(-1)" class="p-2.5 hover:bg-dark-700 rounded-xl text-slate-300 hover:text-gold-400 transition border border-transparent hover:border-dark-600" title="Previous Month">

    <!-- TOAST NOTIFICATION -->
    <div id="toast" class="fixed bottom-5 right-5 z-50 hidden px-4 py-3 bg-dark-800 text-slate-100 text-xs font-semibold rounded-xl shadow-2xl border gold-border flex items-center space-x-2">
        <i id="toastIcon" class="fa-solid fa-circle-check text-gold-400 text-sm"></i>
        <span id="toastMsg">Action completed!</span>
    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script type="module">
        // Firebase is loaded dynamically (not as a static top-level import) so that a
        // blocked/flaky CDN only disables cloud sync instead of crashing the whole page —
        // a static import that fails to resolve aborts the entire module.
        let initializeApp, getFirestore, collection, doc, addDoc, deleteDoc, updateDoc,
            onSnapshot, query, orderBy, serverTimestamp;

        // ============================================================
        // ONE-TIME SETUP: paste your Firebase project config below.
        // Firebase Console -> Project Settings -> General -> Your apps -> Web app
        // One-time setup: paste your Firebase project config below (see index.html comments & repo README).
        // ============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyC0Sqh36422HoeqiLn9Ox342Z1X_6tJJWU",
            authDomain: "casanova-calendar.firebaseapp.com",
            projectId: "casanova-calendar",
            storageBucket: "casanova-calendar.firebasestorage.app",
            messagingSenderId: "251241159982",
            appId: "1:251241159982:web:bdc3abc7edf121e93caebf"
        };

        // APP STATE
        let bookings = [];
        let currentMonth = new Date().getMonth();
        let currentYear = new Date().getFullYear();
        let db = null;

        const MONTH_NAMES = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
        const MONTH_MAP = {
            jan:0, january:0, feb:1, february:1, mar:2, march:2, apr:3, april:3,
            may:4, jun:5, june:5, jul:6, july:6, aug:7, august:7,
            sep:8, sept:8, september:8, oct:9, october:9, nov:10, november:10, dec:11, december:11
        };

        // Two variants because these use Tailwind's raw amber/emerald/purple/rose/cyan palette
        // (outside the gold/dark/slate tokens that re-theme automatically via CSS variables) —
        // the translucent dark-theme tints would be unreadably faint against a light page.
        const BADGE_STYLES_DARK = [
            'bg-gold-500/15 text-gold-300 border-gold-500/40',
            'bg-amber-500/15 text-amber-300 border-amber-500/40',
            'bg-emerald-500/15 text-emerald-300 border-emerald-500/40',
            'bg-purple-500/15 text-purple-300 border-purple-500/40',
            'bg-rose-500/15 text-rose-300 border-rose-500/40',
            'bg-cyan-500/15 text-cyan-300 border-cyan-500/40'
        ];
        const BADGE_STYLES_LIGHT = [
            'bg-gold-100 text-gold-800 border-gold-300',
            'bg-amber-100 text-amber-800 border-amber-300',
            'bg-emerald-100 text-emerald-800 border-emerald-300',
            'bg-purple-100 text-purple-800 border-purple-300',
            'bg-rose-100 text-rose-800 border-rose-300',
            'bg-cyan-100 text-cyan-800 border-cyan-300'
        ];
        function getBadgeStyles() {
            return document.documentElement.getAttribute('data-theme') === 'dark' ? BADGE_STYLES_DARK : BADGE_STYLES_LIGHT;
        }

        window.onload = function() {
            syncThemeToggleIcon();
            initCloudSync();
            renderCalendar();
        };

        // THEME (light default; persisted per-browser via localStorage — a display
        // preference, not booking data, so this is unrelated to the Firestore sync above)
        function syncThemeToggleIcon() {
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            const icon = document.getElementById('themeToggleIcon');
            if (icon) icon.className = isDark ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
        }

        function toggleTheme() {
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            const next = isDark ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            try {
                localStorage.setItem('casanova_theme', next);
            } catch (e) { /* localStorage unavailable — theme just won't persist across visits */ }
            syncThemeToggleIcon();
            renderCalendar(); // booking pill colors depend on theme (see getBadgeStyles)
        }

        // CLOUD SYNC (Firestore) — every visitor reads/writes the same shared collection
        function setSyncStatus(state) {
            const dot = document.getElementById('syncStatusDot');
            const text = document.getElementById('syncStatusText');
            const wrap = document.getElementById('syncStatus');
            const presets = {
                connecting: { dot: 'bg-slate-500', text: 'text-slate-400', border: 'border-dark-600', bg: 'bg-dark-700', label: 'Connecting...' },
                live: { dot: 'bg-emerald-400 animate-pulse', text: 'text-emerald-400', border: 'border-emerald-800', bg: 'bg-emerald-950', label: 'Live Synced' },
                error: { dot: 'bg-rose-400', text: 'text-rose-400', border: 'border-rose-800', bg: 'bg-rose-950', label: 'Sync Error' },
                unconfigured: { dot: 'bg-amber-400', text: 'text-amber-400', border: 'border-amber-800', bg: 'bg-amber-950', label: 'Database Not Set Up' }
            };
            const p = presets[state] || presets.connecting;
            dot.className = `w-2 h-2 mr-1.5 rounded-full ${p.dot}`;
            text.className = p.text;
            text.innerText = p.label;
            wrap.className = `inline-flex items-center px-3 py-1.5 rounded-full text-xs font-semibold ${p.bg} border ${p.border}`;
        }

        async function initCloudSync() {
            if (!firebaseConfig.apiKey || firebaseConfig.apiKey === 'YOUR_API_KEY') {
                setSyncStatus('unconfigured');
                showToast('Shared database is not configured yet — ask the site admin to finish Firebase setup in index.html.', true);
                return;
            }

            try {
                const appMod = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
                const fsMod = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");
                ({ initializeApp } = appMod);
                ({ getFirestore, collection, doc, addDoc, deleteDoc, updateDoc, onSnapshot, query, orderBy, serverTimestamp } = fsMod);

                const app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                const bookingsQuery = query(collection(db, 'bookings'), orderBy('startDate'));

                onSnapshot(bookingsQuery, (snapshot) => {
                    bookings = snapshot.docs.map(docSnap => ({ id: docSnap.id, ...docSnap.data() }));
                    setSyncStatus('live');
                    renderCalendar();
                }, (err) => {
                    console.error('Firestore sync error:', err);
                    setSyncStatus('error');
                    showToast('Cloud sync lost connection: ' + err.message, true);
                });
            } catch (err) {
                console.error('Firebase init/load error:', err);
                db = null;
                setSyncStatus('error');
                showToast('Could not load the shared database (check your internet connection or Firebase config).', true);
            }
        }

        // When a booking's text doesn't state a year, assume the nearest upcoming
        // occurrence of that month/day (today counts as upcoming), never a past one.
        // An explicit year typed by the user is always respected as-is.
        function resolveUpcomingYear(month, day) {
            const now = new Date();
            const todayLocalMidnight = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            const candidate = new Date(now.getFullYear(), month, day);
            return candidate < todayLocalMidnight ? now.getFullYear() + 1 : now.getFullYear();
        }

        // SMART NATURAL DATE PARSER
        function parseDatesFromText(text) {
            // Pattern 1: Range "Oct 31 to Nov 2" or "October 31 - November 2 2026"
            const rangePattern = /(Jan|January|Feb|February|Mar|March|Apr|April|May|Jun|June|Jul|July|Aug|August|Sep|Sept|September|Oct|October|Nov|November|Dec|December)\s+(\d{1,2})(?:\s*,?\s*(\d{4}))?\s*(?:to|-|until)\s*(Jan|January|Feb|February|Mar|March|Apr|April|May|Jun|June|Jul|July|Aug|August|Sep|Sept|September)?\s*(\d{1,2})(?:\s*,?\s*(\d{4}))?/i;
            const rangeMatch = text.match(rangePattern);

            if (rangeMatch) {
                const m1 = MONTH_MAP[rangeMatch[1].toLowerCase()];
                const d1 = parseInt(rangeMatch[2]);
                const y1 = rangeMatch[3] ? parseInt(rangeMatch[3]) : resolveUpcomingYear(m1, d1);

                const m2 = rangeMatch[4] ? MONTH_MAP[rangeMatch[4].toLowerCase()] : m1;
                const d2 = parseInt(rangeMatch[5]);
                // No explicit end year: same year as the start, unless the range wraps
                // into the next year (e.g. "Dec 30 to Jan 2").
                const y2 = rangeMatch[6] ? parseInt(rangeMatch[6]) : (m2 < m1 ? y1 + 1 : y1);

                return {
                    startDate: formatDateString(y1, m1, d1),
                    endDate: formatDateString(y2, m2, d2)
                };
            }

            // Pattern 2: Same Month Range "Nov 1-3 2026", "Oct 10-12"
            const sameMonthRangePattern = /(Jan|January|Feb|February|Mar|March|Apr|April|May|Jun|June|Jul|July|Aug|August|Sep|Sept|September|Oct|October|Nov|November|Dec|December)\s+(\d{1,2})\s*-\s*(\d{1,2})(?:\s*,?\s*(\d{4}))?/i;
            const sameMonthMatch = text.match(sameMonthRangePattern);

            if (sameMonthMatch) {
                const m = MONTH_MAP[sameMonthMatch[1].toLowerCase()];
                const d1 = parseInt(sameMonthMatch[2]);
                const d2 = parseInt(sameMonthMatch[3]);
                const y = sameMonthMatch[4] ? parseInt(sameMonthMatch[4]) : resolveUpcomingYear(m, d1);

                return {
                    startDate: formatDateString(y, m, d1),
                    endDate: formatDateString(y, m, d2)
                };
            }

            // Pattern 3: Single Month Day Year "October 31 2026", "Oct 31, 2026", "31 Oct 2026"
            const monthDayPattern = /(?:(Jan|January|Feb|February|Mar|March|Apr|April|May|Jun|June|Jul|July|Aug|August|Sep|Sept|September|Oct|October|Nov|November|Dec|December)\s+(\d{1,2})|(\d{1,2})\s+(Jan|January|Feb|February|Mar|March|Apr|April|May|Jun|June|Jul|July|Aug|August|Sep|Sept|September))\s*,?\s*(\d{4})?/i;
            const monthDayMatch = text.match(monthDayPattern);

            if (monthDayMatch) {
                let mName = monthDayMatch[1] || monthDayMatch[4];
                let dayNum = parseInt(monthDayMatch[2] || monthDayMatch[3]);
                let monthNum = MONTH_MAP[mName.toLowerCase()];
                let yearNum = monthDayMatch[5] ? parseInt(monthDayMatch[5]) : resolveUpcomingYear(monthNum, dayNum);

                const formatted = formatDateString(yearNum, monthNum, dayNum);
                return { startDate: formatted, endDate: formatted };
            }

            // Pattern 4: Numeric Dates "10/31/2026", "2026-10-31"
            const numericPattern = /(\d{1,4})[\/\-](\d{1,2})[\/\-](\d{1,4})/;
            const numMatch = text.match(numericPattern);

            if (numMatch) {
                let p1 = parseInt(numMatch[1]);
                let p2 = parseInt(numMatch[2]);
                let p3 = parseInt(numMatch[3]);

                let y, m, d;
                if (p1 > 1000) { y = p1; m = p2 - 1; d = p3; }
                else if (p3 > 1000) { y = p3; m = p1 - 1; d = p2; }
                else { m = p1 - 1; d = p2; y = resolveUpcomingYear(m, d); }

                const formatted = formatDateString(y, m, d);
                return { startDate: formatted, endDate: formatted };
            }

            // Fallback: Default to current date if format not matched
            const todayStr = new Date().toISOString().split('T')[0];
            return { startDate: todayStr, endDate: todayStr };
        }

        function formatDateString(y, m, d) {
            const mm = String(m + 1).padStart(2, '0');
            const dd = String(d).padStart(2, '0');
            return `${y}-${mm}-${dd}`;
        }

        // ADD BOOKING ACTION
        async function processAndAddBooking() {
            const textInput = document.getElementById('rawTextInput');
            const rawText = textInput.value.trim();

            if (!rawText) {
                showToast('Please paste a booking message first!', true);
                return;
            }

            if (!db) {
                showToast('Shared database is not configured yet — ask the site admin to finish Firebase setup in index.html.', true);
                return;
            }

            const parsed = parseDatesFromText(rawText);

            try {
                await addDoc(collection(db, 'bookings'), {
                    startDate: parsed.startDate,
                    endDate: parsed.endDate,
                    rawText: rawText,
                    createdAt: serverTimestamp()
                });

                textInput.value = '';

                // Jump calendar to the month of the added booking
                const [bYear, bMonth] = parsed.startDate.split('-').map(Number);
                currentYear = bYear;
                currentMonth = bMonth - 1;

                renderCalendar();
                showToast(`Booking plotted for ${parsed.startDate}${parsed.startDate !== parsed.endDate ? ' to ' + parsed.endDate : ''} — synced for everyone`);
            } catch (err) {
                console.error('Add booking failed:', err);
                showToast('Could not save booking: ' + err.message, true);
            }
        }

        // RENDER MONTHLY CALENDAR
        function renderCalendar() {
            const grid = document.getElementById('calendarGrid');
            grid.innerHTML = '';

            document.getElementById('currentMonthYear').innerText = `${MONTH_NAMES[currentMonth]} ${currentYear}`;

            const firstDay = new Date(currentYear, currentMonth, 1).getDay();
            const totalDays = new Date(currentYear, currentMonth + 1, 0).getDate();
            const prevMonthTotalDays = new Date(currentYear, currentMonth, 0).getDate();

            const todayStr = new Date().toISOString().split('T')[0];

            // Render Previous Month Padding Days
            for (let i = firstDay - 1; i >= 0; i--) {
                const cell = document.createElement('div');
                cell.className = 'bg-dark-900/40 p-2 min-h-[100px] opacity-25 text-slate-600 text-xs font-semibold';
                cell.innerText = prevMonthTotalDays - i;
                grid.appendChild(cell);
            }

            // Render Current Month Days
            for (let day = 1; day <= totalDays; day++) {
                const monthFormatted = String(currentMonth + 1).padStart(2, '0');
                const dayFormatted = String(day).padStart(2, '0');
                const dateStr = `${currentYear}-${monthFormatted}-${dayFormatted}`;

                const isToday = dateStr === todayStr;
                const cell = document.createElement('div');
                cell.className = `p-1.5 sm:p-2 min-h-[100px] bg-dark-800 flex flex-col justify-between transition hover:bg-dark-700/80 cursor-pointer group ${isToday ? 'ring-2 ring-gold-500 ring-inset bg-gold-500/5' : ''}`;
                cell.onclick = () => openDayModal(dateStr);

                // Date Number Header
                const header = document.createElement('div');
                header.className = 'flex justify-between items-center mb-1';
                header.innerHTML = `<span class="text-xs font-bold ${isToday ? 'bg-gold-500 text-black w-5 h-5 rounded-full flex items-center justify-center' : 'text-slate-300 group-hover:text-gold-400'}">${day}</span>`;
                cell.appendChild(header);

                // Bookings Container inside cell
                const container = document.createElement('div');
                container.className = 'space-y-1 flex-1 overflow-y-auto max-h-[75px] scrollbar-none';

                const badgeStyles = getBadgeStyles();
                bookings.forEach((b, idx) => {
                    if (dateStr >= b.startDate && dateStr <= b.endDate) {
                        const pill = document.createElement('div');
                        const styleClass = badgeStyles[idx % badgeStyles.length];
                        const firstLine = b.rawText.split('\n')[0];

                        pill.className = `px-1.5 py-1 rounded text-[10px] font-medium truncate border shadow-sm ${styleClass}`;
                        pill.innerText = firstLine;
                        container.appendChild(pill);
                    }
                });

                cell.appendChild(container);
                grid.appendChild(cell);
            }
        }

        // DAY DETAILS MODAL
        let currentModalDate = null;
        let editingBookingId = null;

        function openDayModal(dateStr) {
            currentModalDate = dateStr;
            editingBookingId = null;
            const d = new Date(dateStr + 'T00:00:00');
            document.getElementById('dayModalTitle').innerText = `Bookings for ${d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })}`;
            renderDayModalList();
            document.getElementById('dayModal').classList.remove('hidden');
        }

        function renderDayModalList() {
            const list = document.getElementById('dayBookingsList');
            list.innerHTML = '';

            const activeBookings = bookings.filter(b => currentModalDate >= b.startDate && currentModalDate <= b.endDate);

            if (activeBookings.length === 0) {
                list.innerHTML = `
                    <div class="text-center py-10 text-slate-500 text-xs">
                        <i class="fa-solid fa-calendar-xmark text-3xl mb-2 text-dark-600"></i>
                        <p class="font-medium">No bookings recorded for this date.</p>
                    </div>
                `;
                return;
            }

            activeBookings.forEach(b => {
                const card = document.createElement('div');
                card.className = 'p-4 bg-dark-900 border border-dark-600 rounded-xl space-y-3 relative hover:border-gold-500/50 transition';

                const dateBadge = b.startDate === b.endDate
                    ? b.startDate
                    : `${b.startDate} to ${b.endDate}`;

                if (editingBookingId === b.id) {
                    card.innerHTML = `
                        <div class="flex items-center justify-between text-xs text-slate-400 font-semibold border-b border-dark-600 pb-2">
                            <span class="text-gold-400"><i class="fa-solid fa-pen mr-1.5"></i>Editing Booking</span>
                        </div>
                        <textarea id="editTextarea_${b.id}" rows="4" class="w-full p-3 bg-dark-800 border border-gold-500/50 focus:border-gold-500 rounded-lg text-xs sm:text-sm font-mono text-slate-200 leading-relaxed outline-none transition">${escapeHtml(b.rawText)}</textarea>
                        <div class="flex items-center justify-end space-x-2">
                            <button onclick="cancelEditBooking()" class="px-3 py-1.5 bg-dark-700 hover:bg-dark-600 text-slate-300 text-xs font-semibold rounded-lg transition border border-dark-600">Cancel</button>
                            <button onclick="saveEditedBooking('${b.id}')" class="px-3 py-1.5 gold-gradient-bg text-black text-xs font-bold rounded-lg transition">Save Changes</button>
                        </div>
                    `;
                } else {
                    card.innerHTML = `
                        <div class="flex items-center justify-between text-xs text-slate-400 font-semibold border-b border-dark-600 pb-2">
                            <span class="text-gold-400"><i class="fa-solid fa-calendar-day mr-1.5"></i>${dateBadge}</span>
                            <div class="flex items-center space-x-1">
                                <button onclick="startEditBooking('${b.id}')" class="text-gold-400 hover:text-gold-300 hover:bg-gold-500/10 px-2 py-1 rounded transition text-xs font-bold flex items-center space-x-1">
                                    <i class="fa-solid fa-pen"></i>
                                    <span>Edit</span>
                                </button>
                                <button onclick="deleteBooking('${b.id}')" class="text-rose-400 hover:text-rose-300 hover:bg-rose-500/10 px-2 py-1 rounded transition text-xs font-bold flex items-center space-x-1">
                                    <i class="fa-solid fa-trash-can"></i>
                                    <span>Delete</span>
                                </button>
                            </div>
                        </div>
                        <pre class="text-xs sm:text-sm font-mono text-slate-200 whitespace-pre-wrap leading-relaxed bg-dark-800 p-3.5 rounded-lg border border-dark-600/80">${escapeHtml(b.rawText)}</pre>
                    `;
                }
                list.appendChild(card);
            });
        }

        function closeDayModal() {
            editingBookingId = null;
            document.getElementById('dayModal').classList.add('hidden');
        }

        function startEditBooking(id) {
            editingBookingId = id;
            renderDayModalList();
        }

        function cancelEditBooking() {
            editingBookingId = null;
            renderDayModalList();
        }

        async function saveEditedBooking(id) {
            if (!db) {
                showToast('Shared database is not configured yet — ask the site admin to finish Firebase setup in index.html.', true);
                return;
            }
            const textarea = document.getElementById(`editTextarea_${id}`);
            const rawText = textarea.value.trim();
            if (!rawText) {
                showToast('Booking details cannot be empty.', true);
                return;
            }

            const parsed = parseDatesFromText(rawText);

            try {
                await updateDoc(doc(db, 'bookings', id), {
                    startDate: parsed.startDate,
                    endDate: parsed.endDate,
                    rawText: rawText,
                    updatedAt: serverTimestamp()
                });
                editingBookingId = null;
                showToast('Booking updated for everyone.');
                closeDayModal();
            } catch (err) {
                console.error('Update booking failed:', err);
                showToast('Could not update booking: ' + err.message, true);
            }
        }

        async function deleteBooking(id) {
            if (!db) {
                showToast('Shared database is not configured yet — ask the site admin to finish Firebase setup in index.html.', true);
                return;
            }
            const confirmation = prompt('This will permanently delete this booking for everyone. Type 12345 to confirm.');
            if (confirmation !== '12345') {
                if (confirmation !== null) {
                    showToast('Deletion cancelled — confirmation code did not match.', true);
                }
                return;
            }
            try {
                await deleteDoc(doc(db, 'bookings', id));
                closeDayModal();
                showToast('Booking deleted for everyone.');
            } catch (err) {
                console.error('Delete booking failed:', err);
                showToast('Could not delete booking: ' + err.message, true);
            }
        }

        // SAMPLE LOADER FOR TESTING
        function loadSampleText(type) {
            const textarea = document.getElementById('rawTextInput');
            if (type === 1) {
                textarea.value = "Jane de leon\nOctober 31 2026\nDay tour 8am to 5pm\n7th birthday celebration\n100pax";
            } else if (type === 2) {
                textarea.value = "Santos Night Swim\nNov 5 2026\nNight Tour 7pm to 7am\nPrivate Pool Access\n30pax";
            } else {
                textarea.value = "Carlos & Maria Wedding\nNov 12 to Nov 14 2026\nFull Garden Venue + Pavilion + Catering\nVIP Guest Accommodations\n₱50,000 Deposit Received";
            }
        }

        // PUBLISH GUIDE MODAL
        function openPublishGuide() {
            document.getElementById('publishGuideModal').classList.remove('hidden');
        }

        function closePublishGuide() {
            document.getElementById('publishGuideModal').classList.add('hidden');
        }

        // CALENDAR NAV CONTROLS
        function changeMonth(delta) {
            currentMonth += delta;
            if (currentMonth > 11) { currentMonth = 0; currentYear++; }
            else if (currentMonth < 0) { currentMonth = 11; currentYear--; }
            renderCalendar();
        }

        function goToToday() {
            const now = new Date();
            currentMonth = now.getMonth();
            currentYear = now.getFullYear();
            renderCalendar();
        }

        function showToast(msg, isError = false) {
            const toast = document.getElementById('toast');
            const icon = document.getElementById('toastIcon');
            
            icon.className = isError 
                ? "fa-solid fa-circle-exclamation text-rose-400 text-sm" 
                : "fa-solid fa-circle-check text-gold-400 text-sm";

            document.getElementById('toastMsg').innerText = msg;
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 3500);
        }

        function escapeHtml(text) {
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // Expose handlers referenced by inline onclick="" attributes —
        // required because this is a module script (module scope isn't global).
        window.processAndAddBooking = processAndAddBooking;
        window.deleteBooking = deleteBooking;
        window.loadSampleText = loadSampleText;
        window.openPublishGuide = openPublishGuide;
        window.closePublishGuide = closePublishGuide;
        window.changeMonth = changeMonth;
        window.goToToday = goToToday;
        window.closeDayModal = closeDayModal;
        window.startEditBooking = startEditBooking;
        window.cancelEditBooking = cancelEditBooking;
        window.saveEditedBooking = saveEditedBooking;
        window.toggleTheme = toggleTheme;
    </script>
</body>
</html>
