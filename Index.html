<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Casanova Garden Resort & Events Place - Booking Sync</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
theme: {
extend: {
colors: {
casanova: {
gold: '#D4AF37',
goldLight: '#F3E5AB',
goldDark: '#AA820A',
dark: '#0D0D0D',
card: '#161616',
border: '#2A2A2A',
accent: '#1E1E1E'
}
},
fontFamily: {
serif: ['Cinzel', 'serif'],
sans: ['Montserrat', 'sans-serif']
}
}
}
}
</script>
<style>
body { background-color: #0D0D0D; color: #E5E5E5; font-family: 'Montserrat', sans-serif; }
.gold-gradient-text { background: linear-gradient(135deg, #FFF0B2 0%, #D4AF37 50%, #997A15 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.gold-border { border-color: rgba(212, 175, 55, 0.3); }
.gold-button { background: linear-gradient(135deg, #D4AF37 0%, #B38F24 100%); color: #0D0D0D; font-weight: 600; }
.gold-button:hover { background: linear-gradient(135deg, #E5C148 0%, #C4A035 100%); }
</style>
</head>
<body class="min-h-screen pb-12">
<!-- Header -->
<header class="border-b border-casanova-border bg-casanova-dark sticky top-0 z-30 shadow-lg">
<div class="max-w-6xl mx-auto px-4 py-4 flex flex-col sm:flex-row items-center justify-between gap-4">
<div class="text-center sm:text-left">
<h1 class="font-serif text-2xl sm:text-3xl font-bold tracking-widest gold-gradient-text">CASANOVA</h1>
<p class="text-xs font-serif tracking-widest text-casanova-goldLight opacity-80 uppercase">Garden Resort & Events Place</p>
</div>
<div class="flex items-center space-x-3">
<span id="syncStatus" class="inline-flex items-center px-3 py-1 rounded-full text-xs font-medium bg-emerald-950 text-emerald-400 border border-emerald-800">
<span class="w-2 h-2 mr-1.5 rounded-full bg-emerald-400 animate-pulse"></span> Cloud Synced
</span>
<button onclick="fetchCloudBookings()" class="p-2 rounded-lg bg-casanova-card border border-casanova-border hover:border-casanova-gold text-casanova-goldLight transition-all">
<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
</button>
</div>
</div>
</header>
<main class="max-w-6xl mx-auto px-4 mt-6">
<!-- Paste Booking Section -->
<section class="bg-casanova-card border gold-border rounded-xl p-5 mb-8 shadow-xl">
<h2 class="font-serif text-lg font-semibold gold-gradient-text mb-2">Paste Booking Details</h2>
<p class="text-xs text-gray-400 mb-3">Paste the unedited booking message. The app automatically detects dates and syncs to the team calendar.</p>
<textarea id="rawText" rows="4" class="w-full bg-casanova-dark border border-casanova-border rounded-lg p-3 text-sm text-gray-200 focus:outline-none focus:border-casanova-gold transition-all" placeholder="Paste booking details here... e.g.&#10;Jane de leon&#10;October 31 2026&#10;Day tour 8am to 5pm&#10;7th birthday&#10;100pax"></textarea>
<div class="mt-3 flex justify-end">
<button onclick="addBookingFromRaw()" class="gold-button px-6 py-2.5 rounded-lg text-sm transition-all shadow-md">Sync & Add to Calendar</button>
</div>
</section>
<!-- Calendar Header -->
<div class="flex items-center justify-between mb-4 bg-casanova-card p-4 rounded-xl border border-casanova-border">
<button onclick="changeMonth(-1)" class="px-3 py-1.5 rounded bg-casanova-dark border border-casanova-border hover:border-casanova-gold text-sm text-casanova-gold">← Prev</button>
<h3 id="currentMonthYear" class="font-serif text-lg font-semibold gold-gradient-text">---</h3>
<button onclick="changeMonth(1)" class="px-3 py-1.5 rounded bg-casanova-dark border border-casanova-border hover:border-casanova-gold text-sm text-casanova-gold">Next →</button>
</div>
<!-- Calendar Grid -->
<div class="grid grid-cols-7 gap-1 sm:gap-2 mb-8">
<div class="text-center font-serif text-xs font-semibold py-2 text-casanova-gold opacity-80">SUN</div>
<div class="text-center font-serif text-xs font-semibold py-2 text-casanova-gold opacity-80">MON</div>
<div class="text-center font-serif text-xs font-semibold py-2 text-casanova-gold opacity-80">TUE</div>
<div class="text-center font-serif text-xs font-semibold py-2 text-casanova-gold opacity-80">WED</div>
<div class="text-center font-serif text-xs font-semibold py-2 text-casanova-gold opacity-80">THU</div>
<div class="text-center font-serif text-xs font-semibold py-2 text-casanova-gold opacity-80">FRI</div>
<div class="text-center font-serif text-xs font-semibold py-2 text-casanova-gold opacity-80">SAT</div>
<div id="calendarDays" class="contents"></div>
</div>
</main>
<!-- Booking Details Modal -->
<div id="dayModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
<div class="bg-casanova-card border gold-border rounded-xl max-w-lg w-full p-6 shadow-2xl max-h-[85vh] overflow-y-auto">
<div class="flex justify-between items-center mb-4 border-b border-casanova-border pb-3">
<h3 id="modalDateTitle" class="font-serif text-lg font-bold gold-gradient-text">---</h3>
<button onclick="closeModal()" class="text-gray-400 hover:text-white">×</button>
</div>
<div id="modalBookingsList" class="space-y-4"></div>
</div>
</div>
<script>
const BIN_ID = '6adb1708ac6210605a4b3eb6';
const API_KEY = '2a10$GtPv6vF8FiuFrdhFYueYQO49kCGcyvy5dc1htkC65jxU8Vm6uoBoW';
let bookings = [];
let currentDate = new Date();
const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
async function fetchCloudBookings() {
document.getElementById('syncStatus').innerText = 'Syncing...';
try {
const res = await fetch(⁠https://api.jsonbin.io/v3/b/${BIN_ID}/latest⁠, {
headers: { 'X-Master-Key': API_KEY }
});
const data = await res.json();
bookings = data.record.bookings || [];
document.getElementById('syncStatus').innerText = 'Cloud Synced';
renderCalendar();
} catch(e) {
console.error(e);
document.getElementById('syncStatus').innerText = 'Sync Failed';
}
}
async function saveCloudBookings() {
document.getElementById('syncStatus').innerText = 'Saving...';
try {
await fetch(⁠https://api.jsonbin.io/v3/b/${BIN_ID}⁠, {
method: 'PUT',
headers: {
'Content-Type': 'application/json',
'X-Master-Key': API_KEY
},
body: JSON.stringify({ bookings: bookings })
});
document.getElementById('syncStatus').innerText = 'Cloud Synced';
} catch(e) {
alert('Failed to sync changes to cloud.');
}
}
function parseDatesFromText(text) {
const lines = text.split('\n');
let foundDate = null;
const currentYear = new Date().getFullYear();
for (let line of lines) {
for (let m = 0; m < monthNames.length; m++) {
const mName = monthNames[m];
const regex = new RegExp(⁠(${mName}|${mName.substr(0,3)})\\s+(\\d{1,2})(?:st|nd|rd|th)?(?:\\s*,?\\s*(\\d{4}))?⁠, 'i');
const match = line.match(regex);
if (match) {
const day = parseInt(match[2]);
const year = match[3] ? parseInt(match[3]) : currentYear;
foundDate = new Date(year, m, day);
break;
}
}
if (foundDate) break;
}
if (!foundDate) {
foundDate = new Date();
}
const yyyy = foundDate.getFullYear();
const mm = String(foundDate.getMonth() + 1).padStart(2, '0');
const dd = String(foundDate.getDate()).padStart(2, '0');
return [⁠${yyyy}-${mm}-${dd}⁠];
}
async function addBookingFromRaw() {
const raw = document.getElementById('rawText').value.trim();
if (!raw) return alert('Please paste booking text.');
const dates = parseDatesFromText(raw);
const newBooking = {
id: Date.now().toString(),
rawText: raw,
dates: dates
};
bookings.push(newBooking);
document.getElementById('rawText').value = '';
await saveCloudBookings();
renderCalendar();
}
async function deleteBooking(id) {
if (confirm('Delete this booking?')) {
bookings = bookings.filter(b => b.id !== id);
await saveCloudBookings();
closeModal();
renderCalendar();
}
}
function renderCalendar() {
const year = currentDate.getFullYear();
const month = currentDate.getMonth();
document.getElementById('currentMonthYear').innerText = ⁠${monthNames[month]} ${year}⁠;
const firstDay = new Date(year, month, 1).getDay();
const totalDays = new Date(year, month + 1, 0).getDate();
const container = document.getElementById('calendarDays');
container.innerHTML = '';
for (let i = 0; i < firstDay; i++) {
const empty = document.createElement('div');
empty.className = 'min-h-[90px] bg-casanova-dark/40 rounded-lg border border-casanova-border/30';
container.appendChild(empty);
}
for (let day = 1; day <= totalDays; day++) {
const dayStr = ⁠${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}⁠;
const dayBookings = bookings.filter(b => b.dates.includes(dayStr));
const cell = document.createElement('div');
cell.className = 'min-h-[90px] bg-casanova-card border border-casanova-border rounded-lg p-1.5 flex flex-col cursor-pointer hover:border-casanova-gold/50 transition-all';
cell.onclick = () => openDayModal(dayStr, dayBookings);
const num = document.createElement('div');
num.className = 'text-xs font-semibold text-gray-400 mb-1';
num.innerText = day;
cell.appendChild(num);
dayBookings.forEach(b => {
const badge = document.createElement('div');
badge.className = 'bg-casanova-dark border border-casanova-gold/40 text-[10px] text-casanova-goldLight p-1 rounded mb-1 truncate';
const firstLine = b.rawText.split('\n')[0] || 'Booking';
badge.innerText = firstLine;
cell.appendChild(badge);
});
container.appendChild(cell);
}
}
function changeMonth(delta) {
currentDate.setMonth(currentDate.getMonth() + delta);
renderCalendar();
}
function openDayModal(dateStr, dayBookings) {
document.getElementById('modalDateTitle').innerText = ⁠Bookings for ${dateStr}⁠;
const list = document.getElementById('modalBookingsList');
list.innerHTML = '';
if (dayBookings.length === 0) {
list.innerHTML = '<p class="text-sm text-gray-400">No bookings on this day.</p>';
} else {
dayBookings.forEach(b => {
const item = document.createElement('div');
item.className = 'bg-casanova-dark border border-casanova-border rounded-lg p-4 relative';
item.innerHTML = ⁠<pre class="text-xs text-gray-200 whitespace-pre-wrap font-sans">${b.rawText}</pre> <button onclick="deleteBooking('${b.id}')" class="mt-3 text-xs text-red-400 hover:underline">Delete Booking</button>⁠;
list.appendChild(item);
});
}
document.getElementById('dayModal').classList.remove('hidden');
}
function closeModal() {
document.getElementById('dayModal').classList.add('hidden');
}
fetchCloudBookings();
</script>
</body>
</html>
